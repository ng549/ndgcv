name: Audit HUD runtime (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hud-runtime-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit deployed HUD configuration without mutation
        shell: bash
        run: node scripts/audit-hud-runtime-identity.mjs
