name: Audit HUD runtime (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hud-runtime-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Audit deployed HUD configuration without mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || 'c8238aed298b28ab172aa56bb1e9cd22';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const canonicalDomain = 'nicolasgoureau.com';
          const requiredBindings = [
            'HUD_CANONICAL_HOST',
            'HUD_ACCESS_TEAM_DOMAIN',
            'HUD_ACCESS_AUD',
            'HUD_OWNER_EMAIL',
            'HUD_BACKEND_ORIGIN',
          ];

          if (!token) {
            console.log(JSON.stringify({ audit: 'unavailable', ciTokenPresent: false }));
            process.exit(1);
          }

          async function read(path) {
            try {
              const response = await fetch(`https://api.cloudflare.com/client/v4/${path}`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              const payload = await response.json().catch(() => null);
              if (!response.ok || !payload?.success) return { ok: false, status: response.status };
              return { ok: true, result: payload.result, resultInfo: payload.result_info };
            } catch {
              return { ok: false, status: 0 };
            }
          }

          function readableBinding(binding) {
            return typeof binding?.text === 'string' ? binding.text.trim() : null;
          }

          function validCanonicalHost(value) {
            return typeof value === 'string' && value.toLowerCase() === canonicalDomain;
          }

          function validTeamDomain(value) {
            try {
              const url = new URL(value);
              return url.protocol === 'https:' && !url.username && !url.password && !url.port && url.pathname === '/' && !url.search && !url.hash && url.hostname.endsWith('.cloudflareaccess.com');
            } catch {
              return false;
            }
          }

          function validAudience(value) {
            return typeof value === 'string' && value.length > 0 && value.length <= 512;
          }

          function validOwner(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
          }

          function fixedBackendOrigin(value) {
            try {
              const url = new URL(value);
              return url.protocol === 'https:' && url.hostname === 'agency-nexus-command.fly.dev' && !url.username && !url.password && !url.port && url.pathname === '/' && !url.search && !url.hash;
            } catch {
              return false;
            }
          }

          function bindingSummary(bindings, name, validator) {
            const binding = bindings.find(candidate => candidate?.name === name);
            if (!binding) return { present: false, readable: false, valid: false };
            const value = readableBinding(binding);
            return { present: true, readable: value !== null, valid: value === null ? null : validator(value) };
          }

          function normalizedAccessPath(value) {
            const path = typeof value === 'string' ? value.trim() : '';
            if (!path) return '/*';
            return path.startsWith('/') ? path : `/${path}`;
          }

          function accessRuleFromUri(value, fallbackPath) {
            if (typeof value !== 'string' || !value.trim()) return null;
            try {
              const raw = value.trim();
              const url = new URL(/^[a-z][a-z\d+.-]*:\/\//i.test(raw) ? raw : `https://${raw}`);
              if (url.protocol !== 'https:' || !url.hostname) return null;
              const explicitPath = url.pathname && url.pathname !== '/' ? url.pathname : '';
              return { domain: url.hostname.toLowerCase(), path: normalizedAccessPath(explicitPath || fallbackPath) };
            } catch {
              return null;
            }
          }

          function normalizeAccessRules(app) {
            const fallbackPath = normalizedAccessPath(app?.path);
            const destinations = Array.isArray(app?.destinations) ? app.destinations.map(destination => destination?.uri) : [];
            return [app?.domain, ...destinations].map(value => accessRuleFromUri(value, fallbackPath)).filter(Boolean);
          }

          function ruleMatchesPath(rule, pathname) {
            if (!rule || rule.domain !== canonicalDomain) return false;
            const expression = `^${rule.path.split('*').map(part => part.replace(/[|\\{}()[\]^$+?.]/g, '\\$&')).join('.*')}$`;
            return new RegExp(expression).test(pathname);
          }

          const [domains, settings, accessApps] = await Promise.all([
            read(`accounts/${account}/workers/domains`),
            read(`accounts/${account}/workers/scripts/ndgcv/settings`),
            read(`accounts/${account}/access/apps?per_page=100`),
          ]);

          const domainIdentity = domains.ok && Array.isArray(domains.result)
            ? Object.fromEntries(['nicolasgoureau.com', 'www.nicolasgoureau.com'].map(hostname => [hostname, domains.result.some(domain => domain?.hostname === hostname && domain?.service === 'ndgcv')]))
            : null;
          const bindings = settings.ok && Array.isArray(settings.result?.bindings) ? settings.result.bindings : [];
          const bindingValidators = {
            HUD_CANONICAL_HOST: validCanonicalHost,
            HUD_ACCESS_TEAM_DOMAIN: validTeamDomain,
            HUD_ACCESS_AUD: validAudience,
            HUD_OWNER_EMAIL: validOwner,
            HUD_BACKEND_ORIGIN: fixedBackendOrigin,
          };
          const hudBindings = settings.ok
            ? Object.fromEntries(requiredBindings.map(name => [name, bindingSummary(bindings, name, bindingValidators[name])]))
            : null;
          const accessRules = accessApps.ok && Array.isArray(accessApps.result) ? accessApps.result.flatMap(normalizeAccessRules) : [];
          const accessRouteCoverage = accessApps.ok
            ? Object.fromEntries(['/hud', '/hud/', '/api/hud', '/api/hud/'].map(pathname => [pathname, accessRules.some(rule => ruleMatchesPath(rule, pathname))]))
            : null;

          console.log(JSON.stringify({
            audit: 'read-only',
            domainRead: { ok: domains.ok, status: domains.ok ? 200 : domains.status, ndgcv: domainIdentity },
            settingsRead: { ok: settings.ok, status: settings.ok ? 200 : settings.status, hudBindings },
            accessRead: {
              ok: accessApps.ok,
              status: accessApps.ok ? 200 : accessApps.status,
              singlePage: accessApps.ok ? !Number.isInteger(accessApps.resultInfo?.total_pages) || accessApps.resultInfo.total_pages <= 1 : null,
              routeCoverage: accessRouteCoverage,
            },
          }));

          if (!domains.ok || !settings.ok || !accessApps.ok) process.exitCode = 1;
          NODE
