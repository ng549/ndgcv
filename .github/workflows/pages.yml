name: Deploy CV
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ndgcv-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production package
        run: npm run build
      - name: Verify production package
        run: npm test
      - name: Select configured Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "$token" ]; then token="${CF_API_TOKEN:-}"; fi
          if [ -z "$token" ]; then token="${CLOUDFLARE_TOKEN:-}"; fi
          if [ -z "$token" ]; then
            echo "Build and tests passed, but no Cloudflare API token repository secret is configured."
            echo "Configure CLOUDFLARE_API_TOKEN for ng549/ndgcv, then re-run this workflow."
            exit 78
          fi
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Cloudflare token detected; secret remains masked."
      - name: Inspect CV domain routing
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID || 'c8238aed298b28ab172aa56bb1e9cd22';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          async function get(path){const r=await fetch('https://api.cloudflare.com/client/v4/'+path,{headers});const j=await r.json();if(!j.success)throw new Error('Routing lookup failed: '+r.status);return j.result}
          const domains=await get('accounts/'+account+'/workers/domains');
          const cv=domains.filter(d=>d.hostname==='nicolasgoureau.com'||d.hostname==='www.nicolasgoureau.com');
          console.log('CV_CUSTOM_DOMAINS',JSON.stringify(cv.map(({hostname,service,environment,zone_id})=>({hostname,service,environment,zone_id}))));
          const zones=await get('zones?name=nicolasgoureau.com');
          for(const z of zones){const routes=await get('zones/'+z.id+'/workers/routes');console.log('CV_WORKER_ROUTES',JSON.stringify(routes.filter(r=>r.pattern.includes('nicolasgoureau.com')).map(({pattern,script})=>({pattern,script}))))}
          NODE
      - name: Deploy existing ndgcv Worker
        run: npx wrangler deploy
      - name: Verify live custom domain
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --retry 6 --retry-delay 2 https://nicolasgoureau.com/apps/)"
          echo "$html" | grep -q 'data-apps-revision="20260925-four-card-v1"'
          echo "$html" | grep -q 'Deal Closer Pro'
          echo "$html" | grep -q 'ImportFlow'
          echo "$html" | grep -q 'VendorReady'
          echo "$html" | grep -q 'WarrantyDesk'
          echo "Verified live custom domain is serving the current four-card Apps page."
