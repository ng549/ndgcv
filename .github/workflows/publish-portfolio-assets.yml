name: Publish Portfolio Assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch production portfolio assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/apps/assets docs/apps/deal-closer-pro/assets
          curl -L -sS "https://appdeployai-v2-qa-screenshots.s3.us-east-1.amazonaws.com/importflow-lcawpq/1790246192750/web.png" -o docs/apps/assets/importflow-desktop.png
          curl -L -sS "https://appdeployai-v2-qa-screenshots.s3.us-east-1.amazonaws.com/importflow-lcawpq/1790246192750/mobile.png" -o docs/apps/assets/importflow-mobile.png
          curl -L -sS "https://appdeployai-v2-qa-screenshots.s3.us-east-1.amazonaws.com/vendorready-50e9yr/1790246264512/web.png" -o docs/apps/assets/vendorready-desktop.png
          curl -L -sS "https://appdeployai-v2-qa-screenshots.s3.us-east-1.amazonaws.com/vendorready-50e9yr/1790246264512/mobile.png" -o docs/apps/assets/vendorready-mobile.png
          curl -L -sS "https://appdeployai-v2-qa-screenshots.s3.us-east-1.amazonaws.com/warrantydesk-afzqxn/1790253004989/web.png" -o docs/apps/assets/warrantydesk-desktop.png
          curl -L -sS "https://appdeployai-v2-qa-screenshots.s3.us-east-1.amazonaws.com/warrantydesk-afzqxn/1790253004989/mobile.png" -o docs/apps/assets/warrantydesk-mobile.png
          curl -L -sS "https://nicolasgoureau.com/apps/assets/deal-closer-pro-preview.png" -o docs/apps/assets/deal-closer-pro-preview.png
          curl -L -sS "https://nicolasgoureau.com/apps/deal-closer-pro/" -o docs/apps/deal-closer-pro/index.html
          curl -L -sS "https://nicolasgoureau.com/apps/deal-closer-pro/assets/index-jYDVfrGi.js" -o docs/apps/deal-closer-pro/assets/index-jYDVfrGi.js
          curl -L -sS "https://nicolasgoureau.com/apps/deal-closer-pro/assets/index-ChvJ8Zsz.css" -o docs/apps/deal-closer-pro/assets/index-ChvJ8Zsz.css
          curl -L -sS "https://nicolasgoureau.com/apps/deal-closer-pro/assets/1420-maple-court.png" -o docs/apps/deal-closer-pro/assets/1420-maple-court.png
          file docs/apps/assets/*.png docs/apps/deal-closer-pro/assets/1420-maple-court.png
      - name: Commit portfolio assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apps/assets docs/apps/deal-closer-pro
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add production app screenshots and preserve Deal Closer Pro"
          git push
