<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Job Search Command Center</title><link rel="stylesheet" href="/style.css"></head>
<body><a class="skip" href="#content">Skip to content</a><div class="shell"><aside><div class="brand">NG<span>COMMAND CENTER</span></div><p class="quiet">Your next chapter.</p><nav aria-label="Main navigation"><button data-view="today" aria-current="page">Today</button><button data-view="opportunity">Opportunities</button><button data-view="contact">People & references</button><button data-view="message">Correspondence</button><button data-view="settings">Connections</button></nav><div class="aside-bottom"><a id="sheet-link" hidden target="_blank" rel="noreferrer">Open control sheet ↗</a><p id="identity"></p><a href="/cdn-cgi/access/logout">Sign out</a></div></aside>
<main id="content"><header><div><p class="eyebrow">JOB SEARCH WORKSPACE</p><h1 id="page-title">Today</h1></div><div class="actions"><button id="refresh">Refresh</button><button class="primary" id="add">+ Opportunity</button></div></header><p id="notice" role="status" aria-live="polite">Connecting to your private workspace…</p><div id="metrics" class="metrics"></div><section id="toolbar" hidden><label>Search<input id="search" type="search" placeholder="Company, role, person, notes…"></label><label id="stage-label">Stage<select id="stage-filter"><option value="">All stages</option></select></label></section><div id="view"></div><footer>Your records stay in your workspace. Sending always requires approval.</footer></main></div>
<dialog id="editor"><form id="record-form"><header><div><p class="eyebrow" id="edit-kind"></p><h2 id="edit-title">New opportunity</h2></div><button type="button" id="close">Close</button></header><div id="fields"></div><p id="form-error" role="alert"></p><div class="form-actions"><button type="button" id="history-button" hidden>View change history</button><button type="submit" class="primary">Save record</button></div><section id="history"></section></form></dialog><script type="module" src="/app.js"></script></body></html>
